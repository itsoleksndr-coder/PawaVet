name: PawaVet dependency audit repair

on:
  push:
    branches:
      - fix/production-smoke-railway-domain-20261105
    paths:
      - '.github/workflows/dependency-audit-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'itsoleksndr-coder/PawaVet'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Refresh vulnerable lockfile packages without changing declared version ranges
        run: |
          npm audit fix --package-lock-only --ignore-scripts --audit-level=high
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Commit validated lockfile repair only to its source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): resolve vulnerable production dependencies"
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/production-smoke-railway-domain-20261105

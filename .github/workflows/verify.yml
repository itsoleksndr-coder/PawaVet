name: Verify build and API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify compiled production server
        run: |
          npm start > /tmp/pawavet-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/appointments
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/ready)" = 503

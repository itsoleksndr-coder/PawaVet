name: PawaVet production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read

jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm database readiness and anonymous isolation
        env:
          BASE_URL: https://pawavet-web-production.up.railway.app
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = process.env.BASE_URL;
          async function request(path) {
            let error;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(base + path, {
                  signal: AbortSignal.timeout(12000),
                  redirect: 'error',
                  headers: { 'Accept': 'application/json' }
                });
                if (response.status >= 500 && attempt < 3) {
                  await new Promise(resolve => setTimeout(resolve, 2500 * attempt));
                  continue;
                }
                return response;
              } catch (e) {
                error = e;
                if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 2500 * attempt));
              }
            }
            throw error || new Error('No response from ' + path);
          }
          const health = await request('/api/health');
          assert.equal(health.status, 200, 'Health endpoint must return 200');
          const state = await health.json();
          assert.equal(state.status, 'ok', 'API must be ready');
          assert.equal(state.database, 'connected', 'Database must be reachable');
          assert.equal(state.storage, 'postgres', 'Production must use PostgreSQL');
          console.log('PASS: PawaVet API and PostgreSQL are ready');
          for (const path of ['/api/auth/session', '/api/clinic']) {
            const response = await request(path);
            assert.equal(response.status, 401, path + ' must reject an anonymous request');
            console.log('PASS: ' + path + ' rejects unauthenticated access');
          }
          console.log('PASS: public production smoke. This does NOT replace authenticated cross-clinic tests.');
          JS
